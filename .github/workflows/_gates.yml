# 可复用的门禁集。PR（ci.yml）与将来的发布流水线**调用同一份**，保证
# 「PR 上验过的东西」和「发布时验的东西」是同一套判据，不会各自漂移。
#
# 不用 workflow_run 触发下游：它有已知的触发时机与权限怪癖（拿不到 PR 的
# secrets、chain 深度限制），reusable workflow + needs 更直白。
#
# 本文件**绝不能出现自托管 runner 的标签**（那个标签字面量本身也被守卫禁止，
# 所以这里只能绕着说）—— 它被 ci.yml（pull_request 触发）引用，就在 PR 可达
# 集合里。deploy/ci/lint-workflows.sh 会沿 uses: 检查这个传递闭包，所以这条
# 不是靠自觉。
#
# 守卫用的是「剥掉注释后全文不得出现该 token」这种最笨的规则，而不是只看
# runs-on:。笨规则无法被 `runs-on: ${{ ... }}` 这类间接写法绕过 —— 代价是
# 注释和 step 名字里也不能出现那个词（这正是本段要绕着说的原因）。
name: gates

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------- 守卫
  # 放在最前面且是最便宜的 job：它是唯一一条"做错了会丢机器"的规则，
  # 不该排在几分钟的构建后面才发现。
  workflow-guard:
    name: workflow 守卫
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # 这一步自己的名字里也不能出现那个标签（守卫是全文匹配，见文件头说明）。
      - name: PR 可达的 workflow 不得使用自托管 runner
        run: bash deploy/ci/lint-workflows.sh

  # ---------------------------------------------------------------- 密钥
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 要扫全历史：密钥"删掉文件"不等于删掉，历史里还在。
          # 2026-10-02 那次历史重写就是这个道理的反面教材（见 README 的
          # 「提交前检查」一节）。
          fetch-depth: 0

      # 路径门禁：该被 .gitignore 挡的是不是真挡住了、有没有密钥被 git 跟踪、
      # deploy/cd/package.filter 有没有漏项。
      - name: 路径门禁
        run: bash deploy/cd/leak-check.sh --tree

      # 内容门禁：扫 key 长什么样的东西（sk-xxx、私钥块等）。与上面的路径
      # 门禁互补 —— 那个管文件名，这个管文件内容。
      - name: 内容与历史扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------- Python
  python:
    name: Python 测试与 lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # 与 Dockerfile 的 python:3.11-slim 对齐
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 装依赖
        run: python -m pip install -r requirements-dev.txt

      # 首版只拦 F/E9/I，理由见 pyproject.toml。加规则之前先看统计。
      - name: ruff
        run: |
          ruff check --statistics .
          ruff check .

      - name: 语法编译
        run: python -m compileall -q src

      # 这 6 条是阶段 2 之前就存在、且已逐条核对过的离线回归网。它们全都不碰
      # 真实模型 Key、不碰 MongoDB、不碰 Docker、不碰真 ERP。
      #
      # 为什么不干脆让 pytest 收集它们、省一遍执行：下面的 pytest 已经覆盖了
      # 其中 5 个模块，重复跑大约多花几十秒 —— 换来的是「pytest 的收集配置
      # 出问题」永远不会掩盖一个真实回归。这条门禁的全部价值就是可靠，
      # 这点冗余是划算的。
      #
      # 工作目录必须是仓库根：代码用 PROJECT_ROOT = __file__ 逐级 parent 解析，
      # src/skills、requirements.txt 都靠它定位。
      #
      # 不需要造一份假 .env：src/ 里没有任何 os.environ[...] 硬读，全是
      # get_env(key, default)，缺 .env 时 env_utils.load_env() 只往 stderr 打一行提示。
      - name: 6 条离线回归
        run: |
          set -eux
          python -m unittest src.test.test_hybrid_review -v
          python -m unittest src.test.test_memory_integration -v
          python -m src.test.test_memory_layer
          python -m unittest src.test.test_web_search -v
          python -m unittest src.test.test_sandbox_lifecycle -v
          python -m unittest src.test.test_grader_transcript -v

      # 收集范围由 pyproject.toml 的 addopts 控制：test_all_tools / test_mcp
      # 在模块顶层就打真实 MCP，必须 --ignore，否则收集阶段就挂住。
      #
      # 地板已补上：pyproject.toml 的 [tool.coverage.report] fail_under = 36，
      # 依据是 2026-10-02 实测的 1796/4909 = 36.586%（报告里显示成 37%，
      # 照着显示值填 37 会当场红）。所以这一步现在**会阻断**，不再只是报告。
      - name: pytest + 覆盖率（地板 36%）
        run: pytest -v --cov --cov-report=term-missing

  # ---------------------------------------------------------------- 前端
  frontend:
    name: 前端类型 / lint / 测试 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"        # 与 frontend/Dockerfile 的 node:22-alpine 对齐
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      # Next 16 移除了 `next lint`，所以走 flat config（eslint.config.mjs）。
      # 只拦 error，warning 仅展示 —— 首版就把 warning 当门禁会让流水线长期
      # 挂在无关紧要的噪声上。
      - name: ESLint（仅 error 阻断）
        working-directory: frontend
        run: npm run lint

      - name: 单元测试
        working-directory: frontend
        run: npm run test

      # **无条件构建，不做 path-filter。** 这是刻意的，不是懒：
      # 删掉 frontend/public/（5 个 create-next-app 占位 svg）那次，Dockerfile 的
      # `COPY --from=build /app/public ./public` 会让构建直接失败，而当时没有任何
      # 东西拦住它 —— 直到有人手工去构建才发现。按路径过滤是"以为覆盖了"的
      # 反面教材，而 build context 是 . 时，docker-compose.yml / Dockerfile 的
      # 改动同样必须触发前端构建。

      # buildx 必须显式 setup。不写这一行，buildx 会落到默认的 `docker` driver，
      # 而它不支持 `cache-to: type=gha` —— 构建直接死在
      # "Cache export is not supported for the docker driver" 上，跟 Dockerfile 无关。
      # 后端 job 一直有 setup-buildx-action，前端这里漏了，所以是「后端绿、前端红」。
      - uses: docker/setup-buildx-action@v3

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: erp-agent-frontend:verify
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # 回归断言：前端镜像必须与环境无关。
      # 一旦有人给 Dockerfile 加了 NEXT_PUBLIC_* 构建参数并把后端地址烧进
      # bundle，这里会红 —— 而不是等到某天发现镜像不能跨环境复用。
      - name: 断言 bundle 里没有硬编码的后端地址
        run: |
          HITS="$(docker run --rm --entrypoint sh erp-agent-frontend:verify -c \
            "grep -rlE 'https?://[a-zA-Z0-9.-]+:(8000|9000)' /app/.next/static /app/.next/server 2>/dev/null || true")"
          if [ -n "$HITS" ]; then
            echo "!! 前端 bundle 里出现了硬编码的后端绝对地址："
            printf '%s\n' "$HITS"
            echo
            echo "   这破坏了「同一个前端镜像在任何环境都能用」这个前提。"
            echo "   检查是不是有人给 frontend/Dockerfile 加了 NEXT_PUBLIC_* 的 ARG。"
            echo "   正确解法是运行时注入配置 —— frontend/src/lib/api.ts 默认 '/api'，"
            echo "   由 nginx 承担代理。"
            exit 1
          fi
          echo "ok：前端 bundle 里没有硬编码的后端地址（镜像与环境无关）"

  # ---------------------------------------------------------------- 备份与迁移
  # 唯一验证「数据库备份真的能恢复」与「迁移真的改对了库」的地方。不构建任何
  # 镜像（只起 mongo），所以它是这批 job 里最便宜的一个，但护住的是最贵的东西。
  #
  # 为什么必须进 PR 门禁：备份链路失效的形态全是「看起来正常」—— 少备份了一个
  # 库（checkpointing_db 不在任何配置里，见 deploy/dr/backup.sh 的文件头）、
  # 自检其实什么都没比、剪枝把要用的那份删了。迁移则是**唯一一个直接改生产库
  # 结构**的自动步骤。这几件事都不会报错，只会在真需要它的那一天暴露，而那天
  # 没有第二次机会。
  backup-dr:
    name: 备份恢复与迁移自检
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 先跑不依赖 Docker 的那一段：几秒钟出结果，且它覆盖的是端到端用例碰
      # 不到的解析/比较路径（清单字段错位、区间边界、剪枝的保护集、迁移的
      # 排序与账本比对）。它抓到过真问题，见那两个脚本的文件头。
      - name: DR 逻辑桩测（不需要 Docker）
        run: |
          bash deploy/ci/dr-logic-test.sh
          bash deploy/ci/migrate-logic-test.sh

      # mongo 的 env_file 指向 deploy/.env，没有它 compose 起不来（口令、
      # MONGODB_URI 都在里面）。
      - name: 生成 CI 环境文件与口令
        run: bash deploy/ci/prepare-stack.sh

      # 断言全在脚本里，不写进 run: —— 阶段 2 的教训：能在命令行单独重跑的
      # 断言才定位得动问题。这两个本地也能跑。
      - name: 备份 → restore 自检 → 负向用例 → 保留策略
        run: bash deploy/ci/backup-dr.sh

      # 复用上一步起好的 mongo（同一个 job 里容器是活着的），顺序不能颠倒：
      # 迁移测试断言的是「账本从 0 行开始」。
      - name: 迁移 → 幂等 → 负向用例（内容被改 / 编号撞车）
        run: bash deploy/ci/migrate-e2e.sh

      - name: 诊断信息
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backup-dr-diagnostics
          path: /tmp/erp-backup-dr
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 边缘链路
  # 「语法没错、语义错了」的改动只有真起一套栈才发现：把 nginx 的
  # `set $backend http://backend:8000` 改成 :9999，结构断言（test_static_config.py）
  # 一条都不会红 —— 头都在、位置都对、语法也对 —— 但运行起来全是 502。
  #
  # 栈的形状：mongo + mock-erp + mcp + backend + frontend + nginx 全是真的，
  # 只有 dind 与 sandbox-image-loader 是 alpine 替身（见 deploy/ci/compose.ci.yml，
  # 那里解释了为什么 backend 对 dind 缺失是优雅降级的）。
  # 真 dind 的验证在下面的 stack-smoke —— 分开是因为调 dind 会淹没认证链路的失败。
  auth-path:
    name: 集成栈（认证与代理链路）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # buildx 必须显式 setup，理由同 frontend job：默认的 `docker` driver 不支持
      # `cache-to: type=gha`，会死在 "Cache export is not supported for the docker
      # driver" 上。
      - uses: docker/setup-buildx-action@v3

      # 三个镜像预先构建并打成 **compose 期望的 tag**（docker-compose.yml 里写死的
      # erp-agent-app:local / erp-agent-frontend:local / erp-mock:local），然后由
      # compose 直接使用 —— 所以这里不能图省事用 `docker compose build`。
      #
      # **scope 带 `-auth` 后缀，刻意与 frontend / build-verify 两个 job 分开。**
      # 它们与本 job 并发跑、写同一个 scope 时，GHA 的缓存写入会撞车（同一个 key
      # 被两个 job 同时导出）。撞车通常只是警告，但也可能让构建挂掉，而那种红点
      # 的根因离代码很远。代价只是少了「同一次运行里蹭上隔壁 job 刚写好的缓存」
      # 这点收益（跨分支本来就取不到，GHA 缓存是按 ref 分域的）。
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: erp-agent-app:local
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
          cache-from: type=gha,scope=app-auth
          cache-to: type=gha,scope=app-auth,mode=max

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: erp-agent-frontend:local
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          cache-from: type=gha,scope=frontend-auth
          cache-to: type=gha,scope=frontend-auth,mode=max

      - name: 构建 mock-erp 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/mock-erp
          push: false
          load: true
          tags: erp-mock:local
          cache-from: type=gha,scope=mock-erp-auth
          cache-to: type=gha,scope=mock-erp-auth,mode=max

      # 早失败早说话：镜像 tag 与 compose 期望的对不上时，compose 会**回头去 build**，
      # 于是症状变成"白等几分钟"，离根因很远。
      - name: 确认三个镜像都在本地
        run: |
          docker image inspect \
            erp-agent-app:local erp-agent-frontend:local erp-mock:local \
            --format '{{.RepoTags}} {{.Id}}'

      # 随机 Mongo 口令、假 LLM Key、以及**同一个**共享密钥写进 deploy/.env 与
      # deploy/nginx.env —— 后者本身就是对「两处必须一致」的运行验证。
      - name: 生成 CI 环境文件与口令
        run: bash deploy/ci/prepare-stack.sh

      # 断言全在这个脚本里，不写进 run: —— 阶段 2 的教训：真机才发现的那些问题
      # 都是靠"脚本能在命令行单独重跑"定位的。脚本同时负责起栈与健康轮询。
      - name: 冒烟（认证链路 + 绕过 nginx 直连 + 密钥不一致负向验证）
        run: bash deploy/ci/smoke-edge.sh

      # 失败时把栈状态与全量日志留下来。CI 上唯一能事后复盘的东西。
      - name: 诊断信息
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-path-diagnostics
          path: /tmp/erp-agent-ci-diagnostics
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 全栈
  # 唯一验证 docker-compose.yml 本身的地方：起栈顺序、真 dind、沙箱基础镜像灌入、
  # 以及 backend 真的建出预热容器。
  #
  # 与 auth-path 的关键差别：**不替换任何服务**。坏起来的代价是慢（dind 冷启动 +
  # 往 dind 里拉 python:3.11-slim），换来的是拓扑从未被 CI 验证过这件事结束了。
  #
  # 为什么 privileged 在这里没问题：ubuntu-latest 是一次性真 VM，容器里的特权
  # 拿不到任何持久东西，VM 用完就销毁。生产机上的自托管 runner 才是那个不能碰的
  # —— 那条规则由 deploy/ci/lint-workflows.sh 强制，不靠自觉。
  stack-smoke:
    name: 集成栈（完整拓扑，含沙箱链路）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 生成 CI 环境文件与口令
        run: bash deploy/ci/prepare-stack.sh

      - name: 起栈并验证沙箱链路
        run: bash deploy/ci/stack-smoke.sh

      - name: 诊断信息
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-smoke-diagnostics
          path: /tmp/erp-agent-ci-diagnostics
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 后端构建
  build-verify:
    name: 后端镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 用官方源而不是 Dockerfile 里的阿里云默认值：runner 在境外，走官方源
      # 更快。顺便实测了 Dockerfile 的 ARG 挂点确实可用 —— 国内部署机用默认值
      # （阿里云）不受影响。
      - name: 构建后端镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: erp-agent-app:verify
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
