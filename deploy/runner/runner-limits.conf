# systemd drop-in：/etc/systemd/system/actions.runner.*.service.d/limits.conf
#
# 机器是 2 核 / 3623MB，生产栈常驻约 715MB。构建与生产**在同一台机器上**，
# "构建把内存打满 → OOM killer 挑中生产容器"是这里唯一一个单次就足够严重的
# 失败模式，所以要有护栏。
#
# 实测（2026-10-02，真机）：前端 next build 进程峰值 400MiB / 102s，
# pip install 在 1200MB 上限下 exit=0 / 99s。1600M 的上限是宽裕的。
#
# ---------------------------------------------------------------- 重要限制
# **这个 slice 管不到 docker build 的构建步骤。** 用默认构建器时，BuildKit 的
# RUN 步骤是 dockerd 起的容器，cgroup 挂在 docker.service 下，不在这个 slice 里；
# systemd 的 MemoryMax 因此只能约束 runner 自身 + git/rsync/docker CLI 这些
# 子进程。真正约束构建步骤的是 erp-agent-builder 这个 buildx builder —— 它用
# docker-container 驱动，driver-opt 上带了 memory/cpu 限额（见 setup-builder.sh）。
# 两处都要有，缺一个就会出现"以为限住了，其实没限"。
#
# MemoryHigh 比 MemoryMax 低：先进入回收/节流，把压力表现出来，而不是直接 OOM。
# 留 300M 的缓冲是为了让构建变慢（可观测）而不是让生产容器被杀（不可逆）。
[Service]
MemoryAccounting=yes
MemoryHigh=1300M
MemoryMax=1600M

# 2 核的机器给 150%（1.5 核）—— 留 0.5 核给生产栈，构建慢一点没关系，
# 它不阻塞任何在线请求。
CPUAccounting=yes
CPUQuota=150%

# 构建是 IO 密集的（npm/pip 解包、镜像层写盘）。压低权重让生产容器的磁盘
# 访问优先。
IOAccounting=yes
IOWeight=50
