worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 下载文件名是中文（如 供应商综合分析汇总_20260922_160745.md），
    # 不设 charset 会导致部分浏览器下乱码。
    charset utf-8;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # 不设 access_log 的默认缓冲问题；日志量以 agent 调用为主。
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Docker 内嵌 DNS。用变量形式的 proxy_pass 强制运行时解析，
    # 这样 backend 容器重建拿到新 IP 后 nginx 不必 reload（upstream 块会
    # 把启动时的 IP 缓存住，重启即 502）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # TLS 开关 + 证书路径（由 templates/tls.conf.template 渲染）。
    # $tls_enabled 非空 = 启用 HTTPS：80 跳 443，443 上跑 ssl + 同一套 location。
    # 留空 = 纯 HTTP，与没配 TLS 之前的行为完全一致（开发 / CI 场景）。
    include /etc/nginx/conf.d/tls.conf;

    # ---------- HTTP server（:80）----------
    # TLS 关闭时：这是主入口，承担全部 location。
    # TLS 开启时：只做 301 跳转到 443（跳转前不认证 —— 浏览器收到 301 会
    # 先跳再弹框，不会把 Basic Auth 密码裸奔在明文 HTTP 上）。
    # /healthz 与 /health 是例外：编排探针带不了凭据也配不了 https，
    # TLS 开启时这两个仍在 80 上可达。
    server {
        listen 80;
        server_name _;

        # 共享密钥（deploy/nginx.env → 本文件由镜像入口脚本从 templates/ 生成）。
        # 为什么需要它：auth_basic 只保证"浏览器来的请求认了人"，但 backend 与
        # dind 同网、沙箱容器跑在 dind 里，沙箱代码能绕过 nginx 直连 backend 并
        # 自己伪造 X-Authenticated-User。这道头只有 nginx 和后端知道。
        include /etc/nginx/conf.d/internal_token.conf;

        # TLS 开启时：把所有 HTTP 请求 301 到 HTTPS（探活端点除外）。
        # `if` 在 server 级做 return 是 nginx 官方明确安全用法之一
        #（https://nginx.org/en/docs/http/ngx_http_rewrite_module.html#if）。
        # TLS 关闭时 $tls_enabled 为空，if 不命中，走下面的正常 location。
        if ($tls_enabled) {
            return 301 https://$host$request_uri;
        }

        # 整个 server 都要认人：API、下载、前端页面一个不落。浏览器只弹一次
        # 输入框，之后同源的 fetch / 下载链接都会自动带上凭据。
        #
        # backend 在 AUTH_MODE=proxy 下强制要求 $remote_user 注入的头，所以
        # 这里漏掉某个 location 不会导致"静默放行"，只会 401 —— 失败方向是安全的。
        auth_basic "ERP Agent";
        auth_basic_user_file /etc/nginx/htpasswd;

        # ---------- 探活 ----------
        # 给编排 / 负载均衡用的存活探针，只证明 nginx 在服务，不碰后端。
        # 刻意不认证：探针带不了凭据。返回体是常量，不泄露任何内部信息。
        location = /healthz {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 就绪探针：反映后端是否真的起来了（nginx 活着但 backend 挂了时，
        # /healthz 仍然 200，这条才会 502）。同样不认证。
        # backend 的 /health 返回 {"status":"ok"}，不含任何敏感信息。
        location = /health {
            auth_basic off;
            access_log off;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }

        # ---------- SSE：必须在 /api/ 之前，且单独一个 location ----------
        # 流式端点 /api/chat/stream 与 /api/chat/{thread_id}/resume。
        # 这里的 Connection 头语义与下面的 / 冲突，所以不能合并。
        location /api/chat/ {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";     # 清空以启用上游 keepalive
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 认证身份。backend 靠它决定 user_id，并丢弃请求体里的 user_id。
            proxy_set_header X-Authenticated-User $remote_user;
            proxy_set_header X-Internal-Auth      $internal_token;

            proxy_buffering off;                # 关键：否则整段 SSE 被缓存后一次性吐出
            proxy_cache off;
            gzip off;                           # 关键：gzip 同样会缓冲
            chunked_transfer_encoding on;

            # Agent 一轮任务可能跑几分钟（实测 30+ 次工具调用）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 其余 API ----------
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Authenticated-User $remote_user;
            proxy_set_header X-Internal-Auth      $internal_token;

            # 下载接口要给大文件留时间
            proxy_read_timeout 300s;
        }

        # ---------- 前端 ----------
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            # 前端不读这个头，但保持与 API 一致：将来若在 SSR 里取用户名，
            # 不必再回来改 nginx。
            proxy_set_header X-Authenticated-User $remote_user;
            proxy_read_timeout 120s;
        }
    }

    # ---------- HTTPS server（:443）----------
    # TLS 开启时承载全部 location（与 :80 的非探活部分完全一致）。
    #
    # 为什么不复用 server 块：nginx 的 `listen 80; listen 443 ssl;` 写法虽然
    # 能让一个 server 同时监听两个端口，但 TLS 关闭时 ssl_certificate 仍会被
    # 解析 —— 路径不存在则 nginx -t 失败。用独立 server 块 + 让 bootstrap.sh
    # **始终**生成一份占位证书（即使纯 HTTP 场景），既保证 nginx -t 永远过，
    # 也让"哪天想开 TLS 只需改一个环境变量"成为可能。
    server {
        listen 443 ssl;
        server_name _;

        # 证书路径是字面量，不是变量：nginx 的 ssl_certificate 在配置加载时
        # 解析路径，不支持运行时变量。bootstrap.sh 始终把证书（真的或自签占位）
        # 生成到固定路径，保证 nginx -t 永远过 —— 哪天想开 TLS 只需设 TLS_ENABLED。
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 1h;

        # TLS 关闭时（$tls_enabled 为空），443 端口通常没人监听也没流量进来；
        # 但为防"有人直连 443 撞上空 server"，这里仍走完整认证 + 代理 ——
        # 行为与 80 一致，不会泄露任何额外信息。
        include /etc/nginx/conf.d/internal_token.conf;
        auth_basic "ERP Agent";
        auth_basic_user_file /etc/nginx/htpasswd;

        location = /healthz {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /health {
            auth_basic off;
            access_log off;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }

        location /api/chat/ {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Authenticated-User $remote_user;
            proxy_set_header X-Internal-Auth      $internal_token;

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Authenticated-User $remote_user;
            proxy_set_header X-Internal-Auth      $internal_token;

            proxy_read_timeout 300s;
        }

        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Authenticated-User $remote_user;
            proxy_read_timeout 120s;
        }
    }
}
